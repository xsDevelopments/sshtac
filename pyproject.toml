[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sshtac"
version = "0.1.0.dev0"
description = "tmux AI companion for human-in-the-loop SSH work"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.15"]

[project.scripts]
sshtac = "sshtac.cli:main"

[tool.setuptools]
packages = ["sshtac"]

[tool.setuptools.package-data]
sshtac = ["config.example.toml"]
